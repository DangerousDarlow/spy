services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    volumes:
      - ./azurite:/data

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    ports:
      - "8081:8081"
      - "10250:10250"
      - "10251:10251"
      - "10252:10252"
      - "10253:10253"
      - "10254:10254"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=false

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474" # toxiproxy HTTP API
      - "7246:7246" # proxied API port
    command: ["-host", "0.0.0.0"]

  dev-init:
    image: node:24-alpine
    depends_on:
      - cosmos
      - toxiproxy
    restart: "no"
    working_dir: /repo/infra
    environment:
      - COSMOS_ENDPOINT=http://cosmos:8081
      - TOXIPROXY_URL=http://toxiproxy:8474
    volumes:
      - ../:/repo
      - dev_init_modules:/repo/infra/node_modules
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "npm install --silent && node cosmos-init-dev.ts && node toxiproxy-init-dev.ts",
      ]

volumes:
  dev_init_modules:
